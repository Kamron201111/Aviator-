<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <title>🚀 Aviator – Raketa Cash Out O‘yini</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #020617;
      --panel: #020617;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.16);
      --danger: #f97373;
      --success: #4ade80;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #111827 0, #020617 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .game-container {
      max-width: 440px;
      width: 100%;
      background: var(--panel);
      border-radius: 18px;
      padding: 18px 18px 20px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      box-shadow:
        0 18px 40px rgba(15, 23, 42, 0.9),
        0 0 0 1px rgba(15, 23, 42, 0.8);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-icon {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 0, #38bdf8 0, #0ea5e9 45%, #0369a1 80%);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.7);
      font-size: 18px;
    }

    .title-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .title-text h1 {
      font-size: 16px;
      letter-spacing: 0.04em;
    }

    .title-text span {
      font-size: 11px;
      color: var(--muted);
    }

    .badge {
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid rgba(56, 189, 248, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7dd3fc;
    }

    .panel {
      background: radial-gradient(circle at top left, #020617 0, #020617 60%);
      border-radius: 14px;
      padding: 12px 12px 14px;
      border: 1px solid rgba(15, 23, 42, 0.95);
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
    }

    .rocket-area {
      position: relative;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .rocket-track {
      position: relative;
      overflow: hidden;
      height: 40px;
      border-radius: 999px;
      border: 1px solid rgba(31, 41, 55, 0.9);
      background: radial-gradient(circle at left, #0b1120 0, #020617 65%);
      padding: 6px 8px;
      display: flex;
      align-items: center;
    }

    .rocket-line {
      flex: 1;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #22c55e 0, #facc15 50%, #ef4444 100%);
      opacity: 0.75;
      transform-origin: left center;
      transform: scaleX(0.05);
      transition: transform 0.1s linear;
    }

    .rocket-icon {
      position: absolute;
      right: 10px;
      font-size: 24px;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.8));
      transition: transform 0.1s linear, opacity 0.15s ease;
    }

    .rocket-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .rocket-status span strong {
      color: var(--accent);
    }

    .timer {
      font-variant-numeric: tabular-nums;
    }

    .coeff {
      font-weight: 700;
      color: #22c55e;
      font-variant-numeric: tabular-nums;
    }

    .coeff.crashed {
      color: var(--danger);
    }

    .crash-point {
      font-size: 11px;
      color: var(--muted);
    }

    .balance-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .balance-label {
      color: var(--muted);
      font-size: 12px;
    }

    .balance-value {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .chip {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      color: var(--muted);
    }

    .bet-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .bet-input-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 12px;
      color: var(--muted);
    }

    input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      font-size: 13px;
      outline: none;
      -moz-appearance: textfield;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.4);
    }

    .quick-bets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .quick-bet-btn {
      flex: 1;
      min-width: 58px;
      padding: 6px 0;
      border-radius: 999px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      background: rgba(15, 23, 42, 0.9);
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .quick-bet-btn:hover {
      border-color: rgba(148, 163, 184, 0.9);
      color: var(--text);
    }

    .quick-bet-btn:active {
      transform: translateY(1px) scale(0.99);
    }

    .actions-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .btn {
      flex: 1;
      padding: 9px 0;
      border-radius: 999px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: 0.03em;
    }

    .btn-primary {
      background: radial-gradient(circle at top, #38bdf8 0, #0ea5e9 40%, #0369a1 100%);
      color: #0b1120;
      box-shadow:
        0 12px 25px rgba(56, 189, 248, 0.35),
        0 0 0 1px rgba(8, 47, 73, 0.9);
    }
